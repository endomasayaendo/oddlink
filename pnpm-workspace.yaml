packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  unrs-resolver: true
overrides:
  # minimatch <11.0.1 is open to denial of service via globparts amplification; typescript-estree
  # still requires ^10. Remove once @typescript-eslint/typescript-estree depends on >=11.0.1.
  "@typescript-eslint/typescript-estree>minimatch": ^11.0.1
  # esbuild <=0.24.2 lets any website send requests to the dev server; @esbuild-kit/core-utils
  # (used by drizzle-kit) pins ^0.18. Remove once drizzle-kit drops @esbuild-kit or it ships >=0.25.
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
minimumReleaseAgeExclude:
  - "@next/env@16.4.3"
  - "@next/eslint-plugin-next@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - eslint-config-next@16.4.3
  - next@16.4.3
